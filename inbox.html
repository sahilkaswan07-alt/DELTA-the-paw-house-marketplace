<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Δ Delta Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="stylesheet" href="listing.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo">Δ Delta</a>
    <ul class="nav-links">
      <li><a href="home.html"><span class="nav-text">Home</span></a></li>
      <li><a href="home.html"><span class="nav-text">Marketplace</span></a></li>
      <li><a href="saved.html"><span class="nav-text">Saved</span></a></li>
      <li><a href="inbox.html"><span class="nav-text">Messages</span></a></li>
      <li><a href="home.html" class="nav-cta">← Back</a></li>
    </ul>
  </nav>

  <section class="inbox-wrap">
    <div class="details-card inbox-card">
      <h1 class="pet-title" style="margin-bottom:.3rem;">Messages</h1>
      <p class="pet-location" style="margin-bottom:1.2rem;">Chats from listings you've posted, and listings you've messaged about.</p>

      <div id="inboxList" class="inbox-list">
        <div class="chat-empty">Loading…</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© <span id="year"></span> Δ Delta · Paw House Marketplace. Made with 🐾</p>
    <br>
     <a class="sahil-kaswan">Designed by: Dr. Sahil Choudhary
        Contact no. 7300479727
      </a>
  </footer>

  <!-- CHAT MODAL -->
  <div class="pbm-overlay" id="chatOverlay">
    <div class="pbm chat-modal">
      <h3 id="chatModalTitle">Chat</h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-error" id="chatError" style="display:none;"></div>
      <form class="chat-input-row" id="chatForm">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type a message…" autocomplete="off" maxlength="500">
        <button type="submit" class="pbm-unlock" id="chatSendBtn">Send</button>
      </form>
      <button class="pbm-cancel" id="chatClose" style="margin-top:.6rem; width:100%;">Close</button>
    </div>
  </div>

  <style>
    .inbox-wrap { max-width: 760px; margin: 0 auto; padding: 100px 20px 60px; }
    .inbox-card { width: 100%; }
    .inbox-list { display: flex; flex-direction: column; gap: .6rem; }
    .inbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding: .85rem 1rem;
      border-radius: 14px;
      background: rgba(122,122,140,0.10);
      border: 1px solid rgba(244,162,77,0.12);
      cursor: pointer;
      transition: background .15s ease;
    }
    .inbox-row:hover { background: rgba(244,162,77,0.10); }
    .inbox-row-main { min-width: 0; }
    .inbox-row-title { font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: .5rem; }
    .inbox-role-tag {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .1rem .5rem;
      border-radius: 20px;
      background: rgba(244,162,77,0.18);
      color: #f4a24d;
    }
    .inbox-row-preview {
      font-size: .82rem;
      color: var(--muted, #7a7a8c);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: .2rem;
      max-width: 480px;
    }
    .inbox-row-time { font-size: .75rem; color: var(--muted, #7a7a8c); flex-shrink: 0; }
    .chat-empty {
      text-align: center;
      color: var(--muted, #7a7a8c);
      font-size: .85rem;
      padding: 1.5rem 0;
    }
    .chat-modal { display: flex; flex-direction: column; max-height: 80vh; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      min-height: 200px;
      max-height: 45vh;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin: .8rem 0;
      padding: .4rem;
    }
    .chat-msg {
      max-width: 78%;
      padding: .55rem .85rem;
      border-radius: 14px;
      font-size: .88rem;
      line-height: 1.35;
      word-wrap: break-word;
      background: rgba(122,122,140,0.14);
      color: var(--text, #e8e2d5);
      align-self: flex-start;
    }
    .chat-msg.mine {
      background: linear-gradient(135deg, #f4a24d, #e07b7b);
      color: #0d0f14;
      align-self: flex-end;
    }
    .chat-input-row { display: flex; gap: .5rem; }
    .chat-input {
      flex: 1;
      padding: .6rem .9rem;
      border-radius: 30px;
      border: 1px solid rgba(244,162,77,0.3);
      background: rgba(19,21,28,0.78);
      color: var(--text, #e8e2d5);
      font-size: .88rem;
      outline: none;
    }
    .chat-input:focus { border-color: var(--accent, #f4a24d); }
    .chat-error {
      color: var(--accent2, #e07b7b);
      font-size: .8rem;
      text-align: center;
      margin-bottom: .6rem;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js" defer></script>
  <script src="firebaseconfig.js" defer></script>
  <script src="cloudinaryconfig.js" defer></script>
  <script src="data.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
  /* ===== BACKGROUND CANVAS (unchanged) ===== */
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  const FOCAL = 560;
  const COLS = [[244,162,77],[224,123,123],[201,111,208],[100,160,255]];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkRing(i){ const col=COLS[i%COLS.length]; return {radius:180+i*70,tilt:(i*0.6)+Math.random()*0.4,spin:(Math.random()-.5)*0.012+0.004,rot:Math.random()*Math.PI*2,points:64,col,nodeOffset:Math.random()*Math.PI*2}; }
  let rings=[];
  function init(){ rings=Array.from({length:6},(_,i)=>mkRing(i)); }
  let mouse={tx:0,ty:0.25}, camRotY=0, camRotX=0.25;
  function project3D(x,y,z){ const cosY=Math.cos(camRotY),sinY=Math.sin(camRotY); let x1=x*cosY-z*sinY,z1=x*sinY+z*cosY; const cosX=Math.cos(camRotX),sinX=Math.sin(camRotX); let y1=y*cosX-z1*sinX,z2=y*sinX+z1*cosX; const scale=FOCAL/(FOCAL+z2+500); return{sx:W*.5+x1*scale,sy:H*.5+y1*scale,scale,z:z2}; }
  function drawBlobs(t){ [{cx:W*.30+Math.sin(t*.30)*110,cy:H*.42+Math.cos(t*.20)*75,r:320,col:'244,162,77',a:.07},{cx:W*.72+Math.cos(t*.25)*90,cy:H*.60+Math.sin(t*.32)*65,r:250,col:'201,111,208',a:.07},{cx:W*.52+Math.sin(t*.18)*70,cy:H*.24+Math.cos(t*.22)*55,r:190,col:'100,160,255',a:.05}].forEach(({cx,cy,r,col,a})=>{ const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }); }
  function drawVignette(){ const g=ctx.createRadialGradient(W/2,H/2,H*.06,W/2,H/2,H*.80); g.addColorStop(0,'rgba(13,15,20,0)'); g.addColorStop(1,'rgba(13,15,20,.85)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  let t=0;
  function animate(){ requestAnimationFrame(animate); t+=.007; camRotY+=(mouse.tx-camRotY)*.02; camRotX+=(mouse.ty-camRotX)*.02; ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,W,H); drawBlobs(t); const drawables=[]; rings.forEach(ring=>{ ring.rot+=ring.spin; const pts=[]; for(let p=0;p<=ring.points;p++){ const a=(p/ring.points)*Math.PI*2; const rx=Math.cos(a)*ring.radius,ry=Math.sin(a)*ring.radius*Math.sin(ring.tilt),rz=Math.sin(a)*ring.radius*Math.cos(ring.tilt); const cs=Math.cos(ring.rot),sn=Math.sin(ring.rot); pts.push(project3D(rx*cs-rz*sn,ry,rx*sn+rz*cs)); } const avgZ=pts.reduce((s,p)=>s+p.z,0)/pts.length; drawables.push({ring,pts,avgZ}); const na=ring.nodeOffset+t*1.3; const nrx=Math.cos(na)*ring.radius,nry=Math.sin(na)*ring.radius*Math.sin(ring.tilt),nrz=Math.sin(na)*ring.radius*Math.cos(ring.tilt); const cs=Math.cos(ring.rot),sn=Math.sin(ring.rot); const node=project3D(nrx*cs-nrz*sn,nry,nrx*sn+nrz*cs); drawables.push({node,ring,avgZ:node.z,isNode:true}); }); drawables.sort((a,b)=>a.avgZ-b.avgZ); drawables.forEach(d=>{ if(d.isNode){ const{node,ring}=d; const depth=Math.max(0,Math.min(1,(node.z+500)/900)); const r=3+depth*4,alpha=.25+depth*.6; const halo=ctx.createRadialGradient(node.sx,node.sy,0,node.sx,node.sy,r*4); halo.addColorStop(0,`rgba(${ring.col[0]},${ring.col[1]},${ring.col[2]},${(alpha*.5).toFixed(3)})`); halo.addColorStop(1,'transparent'); ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(node.sx,node.sy,r*4,0,Math.PI*2); ctx.fill(); ctx.fillStyle=`rgba(255,255,255,${alpha.toFixed(3)})`; ctx.beginPath(); ctx.arc(node.sx,node.sy,Math.max(r,1),0,Math.PI*2); ctx.fill(); } else { const{ring,pts}=d; const depth=Math.max(0,Math.min(1,(d.avgZ+500)/900)); ctx.beginPath(); ctx.strokeStyle=`rgba(${ring.col[0]},${ring.col[1]},${ring.col[2]},${(.08+depth*.22).toFixed(3)})`; ctx.lineWidth=.8+depth*1.2; pts.forEach((p,idx)=>idx===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy)); ctx.stroke(); } }); drawVignette(); }
  window.addEventListener('mousemove',e=>{ mouse.tx=((e.clientX/W)-.5)*0.6; mouse.ty=0.25+((e.clientY/H)-.5)*0.4; });
  window.addEventListener('mouseleave',()=>{ mouse.tx=0; mouse.ty=0.25; });
  resize(); init(); animate();
  window.addEventListener('resize',()=>{ resize(); init(); });

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ===== CHAT MODAL PLUMBING (shared with listing.html) ===== */
  const chatOverlay = document.getElementById('chatOverlay');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatError = document.getElementById('chatError');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');

  let activeChatId = null;
  let unsubChat = null;
  let myUid = null;

  function timeAgo(ms){
    if (!ms) return '';
    const diff = Date.now() - ms;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  function renderMessages(messages){
    if (messages.length === 0) {
      chatMessagesEl.innerHTML = '<div class="chat-empty">No messages yet — say hello 👋</div>';
      return;
    }
    chatMessagesEl.innerHTML = messages.map(m => {
      const mine = m.senderId === myUid ? ' mine' : '';
      const safeText = m.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<div class="chat-msg${mine}">${safeText}</div>`;
    }).join('');
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function closeChat(){
    chatOverlay.classList.remove('open');
    if (unsubChat) { unsubChat(); unsubChat = null; }
    activeChatId = null;
  }

  async function openChat(chat){
    chatError.style.display = 'none';
    chatMessagesEl.innerHTML = '<div class="chat-empty">Loading…</div>';
    chatInput.value = '';
    const otherPartyLabel = chat.role === 'seller' ? 'Buyer' : (chat.sellerName || 'Seller');
    document.getElementById('chatModalTitle').textContent = `${chat.petName || 'Chat'} · ${otherPartyLabel}`;
    chatOverlay.classList.add('open');

    try {
      myUid = await DeltaStore.getCurrentUid();
      activeChatId = chat.id;
      chatInput.disabled = false;
      chatSendBtn.disabled = false;
      unsubChat = DeltaStore.onChatMessages(activeChatId, renderMessages);
    } catch (err) {
      chatMessagesEl.innerHTML = '';
      chatError.textContent = err.message || 'Chat is unavailable right now.';
      chatError.style.display = 'block';
      chatInput.disabled = true;
      chatSendBtn.disabled = true;
    }
  }

  document.getElementById('chatClose').addEventListener('click', closeChat);

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!activeChatId) return;
    const text = chatInput.value;
    if (!text.trim()) return;
    chatInput.value = '';
    chatSendBtn.disabled = true;
    try {
      await DeltaStore.sendMessage(activeChatId, text);
    } catch (err) {
      console.error('Failed to send message:', err);
      chatInput.value = text;
    }
    chatSendBtn.disabled = false;
    chatInput.focus();
  });

  /* ===== LOAD INBOX ===== */
  const inboxList = document.getElementById('inboxList');

  (async () => {
    try {
      myUid = await DeltaStore.getCurrentUid();
      DeltaStore.onMyChats(chats => {
        if (chats.length === 0) {
          inboxList.innerHTML = '<div class="chat-empty">No messages yet. Chats you start, or receive on your listings, will show up here.</div>';
          return;
        }
        inboxList.innerHTML = chats.map(chat => {
          const roleTag = chat.role === 'seller' ? 'Selling' : 'Buying';
          const otherPartyLabel = chat.role === 'seller' ? 'Buyer' : (chat.sellerName || 'Seller');
          const preview = chat.lastMessage
            ? (chat.lastSenderId === myUid ? `You: ${chat.lastMessage}` : chat.lastMessage)
            : 'No messages yet';
          const safePreview = preview.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `
            <div class="inbox-row" data-chat-id="${chat.id}">
              <div class="inbox-row-main">
                <div class="inbox-row-title">
                  <span class="inbox-role-tag">${roleTag}</span>
                  ${chat.petName || 'Listing'} · ${otherPartyLabel}
                </div>
                <div class="inbox-row-preview">${safePreview}</div>
              </div>
              <div class="inbox-row-time">${timeAgo(chat.updatedAt)}</div>
            </div>`;
        }).join('');

        inboxList.querySelectorAll('.inbox-row').forEach(row => {
          row.addEventListener('click', () => {
            const chat = chats.find(c => c.id === row.dataset.chatId);
            if (chat) openChat(chat);
          });
        });
      });
    } catch (err) {
      inboxList.innerHTML = `<div class="chat-empty">${err.message || 'Could not load messages right now.'}</div>`;
    }
  })();
  }); // end DOMContentLoaded
</script>

</body>
</html>
